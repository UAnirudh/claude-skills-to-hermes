name: CI

on:
  push:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run tests
        run: pytest -q --cov=skill_bridge --cov-report=term-missing

      - name: Check README harness table matches the exporters
        run: pytest -q tests/test_readme.py

      # Drift in the checkout shows up on the copy it belongs to rather than
      # only failing the job. No profile is committed in this repo, so a normal
      # run announces that; a project that checks in a profile gets one
      # annotation per finding. Only the copies' own SKILL.md is annotated.
      - name: Annotate drift
        shell: bash
        run: |
          if [ ! -f skill-bridge.yaml ]; then
            echo "::notice::no skill-bridge.yaml in the repository root to check"
            exit 0
          fi
          report="${RUNNER_TEMP:-.}/doctor.json"
          skill-bridge doctor --json > "$report"
          skill-bridge annotate --report "$report"

      - name: Smoke test CLI
        shell: bash
        run: |
          out=".ci-out"
          rm -rf "$out"
          skill-bridge list-formats
          skill-bridge detect
          skill-bridge validate examples/source-claude-code/code-review
          skill-bridge convert examples/source-claude-code/code-review \
            --to hermes --to gemini --to copilot --to devin -o "$out"
          for expected in \
            "$out/hermes/.hermes/skills/code-review/SKILL.md" \
            "$out/gemini/.gemini/skills/code-review/SKILL.md" \
            "$out/copilot/.github/skills/code-review/SKILL.md" \
            "$out/devin/.devin/skills/code-review/SKILL.md"
          do
            test -f "$expected" || { echo "missing $expected"; exit 1; }
          done

      # Project-scope import: every path is relative to the working directory,
      # so this runs the same on Linux, macOS and Windows. (The global-scope
      # flavour below needs HOME, which Python ignores on Windows.)
      - name: Smoke test cross-harness import (project scope)
        shell: bash
        run: |
          work=".ci-import"
          rm -rf "$work"
          mkdir -p "$work/.claude/skills/demo" "$work/.gemini/skills/demo2"
          printf -- '---\nname: demo\ndescription: Demo skill for the CI import smoke test.\n---\n\n# Demo\n' \
            > "$work/.claude/skills/demo/SKILL.md"
          printf -- '---\nname: demo2\ndescription: Second demo skill for the CI import smoke test.\n---\n\n# Demo 2\n' \
            > "$work/.gemini/skills/demo2/SKILL.md"
          cd "$work"
          skill-bridge install --harness hermes --scope project --dry-run
          test ! -d ".hermes/skills" || { echo "dry run wrote output"; exit 1; }
          skill-bridge install --harness hermes --scope project
          test -f ".hermes/skills/demo/SKILL.md"
          test -f ".hermes/skills/demo2/SKILL.md"
          grep -q "name: demo2" ".hermes/skills/demo2/SKILL.md"
          grep -q "generated-by" ".hermes/skills/demo2/.skill-bridge.json"
          # The profile install wrote must target the project directory too, or
          # sync/watch would refresh (and create) a separate global copy.
          grep -q "scope: project" skill-bridge.yaml
          printf -- '\n## Follow-up\n' >> ".gemini/skills/demo2/SKILL.md"
          skill-bridge sync
          grep -q "## Follow-up" ".hermes/skills/demo2/SKILL.md"
          # A second install rewrites the profile for the harness just asked
          # for, so sync cannot keep refreshing a stale destination.
          skill-bridge install --harness gemini --scope project --no-sync
          grep -q "format: gemini" skill-bridge.yaml
          ! grep -q "format: hermes" skill-bridge.yaml
          # Unknown harness ids are a clean argument error, never a traceback.
          if skill-bridge install --harness not-a-harness 2>/dev/null; then
            echo "unknown harness id was accepted"
            exit 1
          fi

      # Stale-copy cleanup: the copy whose source was deleted is pruned, but
      # only after a dry run that changes nothing, and a hand-written skill in
      # the same harness survives both prune and uninstall. Project scope keeps
      # every path relative, so this runs the same on Linux, macOS and Windows.
      - name: Smoke test prune and uninstall
        shell: bash
        run: |
          work=".ci-prune"
          rm -rf "$work"
          mkdir -p "$work/.claude/skills/gone" "$work/.claude/skills/keep" \
            "$work/.hermes/skills/handwritten"
          printf -- '---\nname: gone\ndescription: Source deleted before the prune smoke test.\n---\n\n# Gone\n' \
            > "$work/.claude/skills/gone/SKILL.md"
          printf -- '---\nname: keep\ndescription: Source that stays for the prune smoke test.\n---\n\n# Keep\n' \
            > "$work/.claude/skills/keep/SKILL.md"
          # No .skill-bridge.json marker: this one belongs to the harness.
          printf -- '---\nname: handwritten\ndescription: Authored in the target, so never ours to delete.\n---\n\n# Handwritten\n' \
            > "$work/.hermes/skills/handwritten/SKILL.md"
          cd "$work"
          skill-bridge install --harness hermes --scope project
          test -f ".hermes/skills/gone/SKILL.md"
          test -f ".hermes/skills/keep/SKILL.md"
          # doctor is read-only and passes while every copy matches its source.
          skill-bridge doctor --strict
          rm -rf ".claude/skills/gone"
          # A deleted source is drift: the gate must fail and name the copy.
          if skill-bridge doctor --strict > doctor-drift.txt 2>&1; then
            echo "doctor --strict passed with a stale copy"
            exit 1
          fi
          grep -q "Source gone" doctor-drift.txt
          # The dry run names the orphan and must leave it on disk.
          skill-bridge sync --prune --dry-run > dry-run.txt
          test -d ".hermes/skills/gone" || { echo "dry run removed a skill"; exit 1; }
          grep -q "Would prune 1 skill" dry-run.txt
          # doctor --fix applies both repairs itself: prune the orphan, refresh
          # anything behind its source. It exits non-zero only if drift remains.
          skill-bridge doctor --fix --strict > fix.txt
          test ! -d ".hermes/skills/gone" || { echo "orphan survived doctor --fix"; exit 1; }
          grep -q "Fixed 1 stale" fix.txt
          grep -q "No drift left" fix.txt
          # ...and the gate is still green afterwards.
          skill-bridge doctor --strict
          # A copy whose source still exists, and the hand-written skill, stay.
          test -f ".hermes/skills/keep/SKILL.md"
          test -f ".hermes/skills/handwritten/SKILL.md"
          # --dry-run is only meaningful together with --prune.
          if skill-bridge sync --dry-run 2>/dev/null; then
            echo "sync --dry-run without --prune was accepted"
            exit 1
          fi
          # uninstall clears the generated copy and still spares the native one.
          skill-bridge uninstall --harness hermes --scope project > uninstall.txt
          test ! -d ".hermes/skills/keep" || { echo "uninstall kept a generated copy"; exit 1; }
          test -f ".hermes/skills/handwritten/SKILL.md"
          grep -q "Removed 1 skill" uninstall.txt
          # uninstall also forgets the target it emptied, so the sync that used
          # to resurrect every copy must now have nothing to do.
          if skill-bridge sync > sync-after-uninstall.txt 2>&1; then
            echo "sync succeeded after uninstall"
            exit 1
          fi
          test ! -d ".hermes/skills/keep" || {
            echo "sync recreated an uninstalled copy"
            exit 1
          }
          # A profile kept outside the default locations is forgotten when it is
          # named with --config, so an explicit sync cannot resurrect it either.
          mkdir -p "custom/.claude/skills/demo"
          printf -- '---\nname: demo\ndescription: Skill for the custom-config prune smoke test.\n---\n\n# Demo\n' \
            > "custom/.claude/skills/demo/SKILL.md"
          cd custom
          skill-bridge install --harness hermes --scope project --config bridge.yaml
          test -f "bridge.yaml"
          test -f ".hermes/skills/demo/SKILL.md"
          skill-bridge uninstall --harness hermes --scope project --config bridge.yaml \
            > uninstall-custom.txt
          test ! -d ".hermes/skills/demo" || { echo "custom uninstall kept a copy"; exit 1; }
          test ! -f "bridge.yaml" || { echo "custom profile survived uninstall"; exit 1; }
          if skill-bridge sync --config bridge.yaml 2>/dev/null; then
            echo "sync --config succeeded after uninstall"
            exit 1
          fi
          test ! -d ".hermes/skills/demo" || {
            echo "sync --config recreated an uninstalled copy"
            exit 1
          }

      # The report is a published format: it has to name its version, and the
      # schema has to describe the document the command actually writes.
      - name: Smoke test the report schema
        shell: bash
        run: |
          work=".ci-schema"
          rm -rf "$work"
          mkdir -p "$work/.claude/skills/demo"
          printf -- '---\nname: demo\ndescription: Skill for the schema smoke test.\n---\n\n# Demo\n' \
            > "$work/.claude/skills/demo/SKILL.md"
          cd "$work"
          skill-bridge doctor --schema > schema.json
          skill-bridge install --harness hermes --scope project
          skill-bridge doctor --json > report.json || true
          python - <<'PY'
          import json

          schema = json.load(open("schema.json"))
          report = json.load(open("report.json"))
          version = schema["properties"]["report-version"]["const"]
          assert report["report-version"] == version, (report["report-version"], version)
          for key in schema["required"]:
              assert key in report, f"report is missing {key}"
          print("report schema smoke test passed, version", version)
          PY

      # A hand edit has two answers: `sync` throws it away, `accept` keeps it.
      # This checks accept keeps the text, silences the warning, and does not
      # turn a later source change into a silent overwrite.
      - name: Smoke test accept
        shell: bash
        run: |
          work=".ci-accept"
          rm -rf "$work"
          mkdir -p "$work/.claude/skills/demo"
          printf -- '---\nname: demo\ndescription: Skill for the accept smoke test.\n---\n\n# Demo\n' \
            > "$work/.claude/skills/demo/SKILL.md"
          cd "$work"
          skill-bridge install --harness hermes --scope project
          printf -- '\n## Written by hand\n' >> ".hermes/skills/demo/SKILL.md"
          if skill-bridge doctor --strict > before.txt 2>&1; then
            echo "doctor passed a hand-edited copy"
            exit 1
          fi
          grep -q "Edited by hand" before.txt
          skill-bridge accept > accept.txt
          grep -q "Accepted 1 copy" accept.txt
          skill-bridge doctor --strict
          grep -q "Written by hand" ".hermes/skills/demo/SKILL.md"
          # Editing the source again is a decision, not a silent overwrite.
          printf -- '\n## Added later\n' >> ".claude/skills/demo/SKILL.md"
          if skill-bridge doctor --fix --strict > after.txt 2>&1; then
            echo "doctor --fix resolved an accepted copy"
            exit 1
          fi
          grep -q "accepted copy" after.txt
          grep -q "Written by hand" ".hermes/skills/demo/SKILL.md"
          echo "accept smoke test passed"

      # Two runs must not interleave: the second waits, then says why it stopped
      # instead of writing anyway. This also exercises the Windows locking branch,
      # which no unit test can reach on the other runners.
      - name: Smoke test the run lock
        shell: bash
        run: |
          work=".ci-lock"
          rm -rf "$work"
          mkdir -p "$work/.claude/skills/demo"
          printf -- '---\nname: demo\ndescription: Skill for the run lock smoke test.\n---\n\n# Demo\n' \
            > "$work/.claude/skills/demo/SKILL.md"
          cd "$work"
          skill-bridge install --harness hermes --scope project --no-sync
          cat > holder.py <<'PY'
          import sys, time
          from pathlib import Path
          from skill_bridge.locking import exclusive_run

          with exclusive_run(Path(sys.argv[1]), wait=0):
              print("ready", flush=True)
              time.sleep(20)
          PY
          python holder.py "$PWD/.skill-bridge.lock" > ready.txt &
          holder=$!
          for _ in $(seq 1 100); do
            grep -q ready ready.txt 2>/dev/null && break
            sleep 0.1
          done
          grep -q ready ready.txt || { echo "holder never took the lock"; exit 1; }
          if skill-bridge sync --lock-timeout 0 > busy.txt 2>&1; then
            echo "sync ran while another run held the lock"
            cat busy.txt
            exit 1
          fi
          grep -q "another skill-bridge run" busy.txt || {
            echo "the busy lock was not explained"
            cat busy.txt
            exit 1
          }
          kill "$holder" 2>/dev/null || true
          wait "$holder" 2>/dev/null || true
          # With the lock free again the same command does its work.
          skill-bridge sync --lock-timeout 5
          test -f ".hermes/skills/demo/SKILL.md"
          echo "run lock smoke test passed"

      # `annotate` is what a project's CI calls: prove it points at the line that
      # differs, that drift is an error, that a hand-edited copy is only a
      # warning, that a piped report gives the same answers as a live check, and
      # that a clean profile emits nothing.
      - name: Smoke test doctor annotations
        shell: bash
        run: |
          work=".ci-annotate"
          rm -rf "$work"
          mkdir -p "$work/.claude/skills/demo"
          printf -- '---\nname: demo\ndescription: Skill for the annotation smoke test.\n---\n\n# Demo\n' \
            > "$work/.claude/skills/demo/SKILL.md"
          cd "$work"
          skill-bridge install --harness hermes --scope project
          # A copy behind its source is drift a command can fix, so it is an
          # error aimed at the SKILL.md line that differs, never line 1.
          printf -- '\n## Later\n' >> ".claude/skills/demo/SKILL.md"
          skill-bridge annotate > annotations.txt
          grep -Eq '^::error file=.*[\\/][.]hermes[\\/]skills[\\/]demo[\\/]SKILL[.]md,line=[0-9]+::demo \(hermes\): source changed since this copy was converted$' \
            annotations.txt
          if grep -q 'SKILL[.]md,line=1::' annotations.txt; then
            echo "the annotation fell back to line 1"
            cat annotations.txt
            exit 1
          fi
          test "$(grep -c '^::' annotations.txt)" -eq 1 || {
            echo "expected exactly one out-of-sync annotation"
            cat annotations.txt
            exit 1
          }
          # A document read from a file, and one piped on stdin, must give the
          # same annotations: that is how a pip-installed project consumes this.
          skill-bridge doctor --json > report.json
          skill-bridge annotate --report report.json > from-file.txt
          skill-bridge doctor --json | skill-bridge annotate --report - > from-stdin.txt
          diff from-file.txt annotations.txt
          diff from-stdin.txt annotations.txt
          # A copy edited by hand must never be overwritten by --fix, so it
          # warns rather than failing the annotation contract.
          skill-bridge sync
          printf -- '\n<!-- hand written -->\n' >> ".hermes/skills/demo/SKILL.md"
          skill-bridge annotate > annotations.txt
          grep -Eq '^::warning file=.*[\\/][.]hermes[\\/]skills[\\/]demo[\\/]SKILL[.]md,line=[0-9]+::demo \(hermes\): edited by hand since it was written$' \
            annotations.txt
          test "$(grep -c '^::' annotations.txt)" -eq 1 || {
            echo "expected exactly one edited annotation"
            cat annotations.txt
            exit 1
          }
          # Nothing to report means no annotations at all, not a bare summary.
          skill-bridge sync
          skill-bridge annotate > annotations.txt
          test ! -s annotations.txt || {
            echo "a clean profile produced annotations"
            cat annotations.txt
            exit 1
          }
          echo "annotations smoke test passed"

      # Global-scope import plus the auto-import profile that `install` writes:
      # `sync` must refresh from the harnesses detected at install time.
      - name: Smoke test install profile and sync
        if: runner.os != 'Windows'
        shell: bash
        run: |
          home="$(mktemp -d)"
          project="$(mktemp -d)"
          export HOME="$home"
          mkdir -p "$home/.claude/skills/demo" "$home/.gemini/skills/demo2"
          printf -- '---\nname: demo\ndescription: Demo skill for the CI import smoke test.\n---\n\n# Demo\n' \
            > "$home/.claude/skills/demo/SKILL.md"
          printf -- '---\nname: demo2\ndescription: Second demo skill for the CI import smoke test.\n---\n\n# Demo 2\n' \
            > "$home/.gemini/skills/demo2/SKILL.md"
          cd "$project"
          skill-bridge install --harness hermes
          test -f "$home/.hermes/skills/demo/SKILL.md"
          test -f "$home/.hermes/skills/demo2/SKILL.md"
          printf -- '\n## Follow-up\n' >> "$home/.gemini/skills/demo2/SKILL.md"
          skill-bridge sync
          grep -q "## Follow-up" "$home/.hermes/skills/demo2/SKILL.md"
          skill-bridge install --harness devin --from claude-code --from gemini
          test -f "$home/.config/devin/skills/demo/SKILL.md"
