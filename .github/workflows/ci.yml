name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run tests
        run: pytest -q --cov=skill_bridge --cov-report=term-missing

      - name: Smoke test CLI
        run: |
          skill-bridge list-formats
          skill-bridge detect
          skill-bridge validate examples/source-claude-code/code-review
          skill-bridge convert examples/source-claude-code/code-review --to hermes --to gemini --to copilot -o /tmp/out
        shell: bash

      - name: Smoke test cross-harness import
        run: |
          export HOME="$(mktemp -d)"
          mkdir -p "$HOME/.claude/skills/demo" "$HOME/.gemini/skills/demo2"
          printf -- '---\nname: demo\ndescription: Demo skill for the CI import smoke test.\n---\n\n# Demo\n' > "$HOME/.claude/skills/demo/SKILL.md"
          printf -- '---\nname: demo2\ndescription: Second demo skill for the CI import smoke test.\n---\n\n# Demo 2\n' > "$HOME/.gemini/skills/demo2/SKILL.md"
          skill-bridge install --harness hermes --dry-run
          skill-bridge install --harness hermes
          test -f "$HOME/.hermes/skills/demo/SKILL.md"
          test -f "$HOME/.hermes/skills/demo2/SKILL.md"
        shell: bash
