[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-bridge"
version = "1.19.0"
description = "Convert agent skills between every coding harness: Claude Code, Hermes, Codex, Cursor, Gemini CLI, Copilot, OpenCode, Windsurf, and more"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Skill Bridge" }]
keywords = ["agent-skills", "claude-code", "hermes", "codex", "cursor", "gemini-cli", "copilot", "opencode", "ai-agents", "skill-converter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "pyyaml>=6.0",
  "rich>=13.0",
  "click>=8.1",
]

[project.optional-dependencies]
watch = [
  "watchdog>=4.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "watchdog>=4.0",
]
all = [
  "watchdog>=4.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
skill-bridge = "skill_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["skill_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:skill_bridge.*"]
